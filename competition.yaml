# copy (title, summary, demand) stays off tests/unit/support/public-copy.ts OFF_BOARD words and names no profit, bet,
# wager or odds.
#
# Dates (set at finalize, T0 the next whole UTC hour at least 90 minutes after the bundle was sealed; every one derives
# from T0 = opens_at). The universe was snapshotted again at finalize and was the same 24 markets, so the practice was
# not re-cut and the snapshot instant below is the first one's:
#   T0        2026-11-13T09:00:00Z   opens_at, the dev phase's start
#   T0+8h     2026-11-13T17:00:00Z   the house baseline entered (house-entry-due.ts: deadline - 4 h)
#   T0+11h    2026-11-13T20:00:00Z   the house model forecast's final cut (deadline - 1 h)
