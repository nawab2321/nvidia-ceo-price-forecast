# The practice's dates (2026-11-12T06:00:00Z to 2026-11-13T06:00:00Z) are the sealed instance's, not T0's.
#
# Grading budget (server/competitions/grading-budget.ts at 2,000 entries, tests/unit/grading-budget-bundles.test.ts):
