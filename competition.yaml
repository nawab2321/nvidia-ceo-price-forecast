# Polymarket NVIDIA CEO forecast 01: forecast, minute by minute and 4 hours ahead, the Yes price of every trading
# market of Polymarket's "Next CEO of NVIDIA?" event (https://polymarket.com/event/next-ceo-of-nvidia), as five
# quantiles a minute, over the 48 hours after entries close. SEALED (finalize, 2026-11-13): open and public, its escrow
# funded at open, so once seeded its bytes and its three sealed trees never change again (.cosmos/rules/contest-design.mdc:
# server/db/seed/competitions.ts refuseRulesChange). tests/unit/comp-polymarket-nvidia-ceo-forecast-01.test.ts holds the
# bundle, its rules' quotes and its grading end to end; tests/unit/canonical-parity.test.ts and
# tests/unit/contracts-practice-windows.test.ts pin its sha256. The
# owner's ask of 2026-11-12: "software that predicts most accurately the tick-by-tick movement of the prediction market
# percents for next CEO of Nvidia Market ... the contest runs for 12 hours. And then ... probably for 48 hours or until
# the CEO is actually selected ... we basically test all their bots to see which one is able to track it most accurately
# over time. And the reward can be $250 bounty total, but we spread it across like at least 100 entrants." The root
# planner's design contract (#2) as its amendment A1 and the rulings after research #3 amend it.
#
# The universe (collector/polymarket-forecast/market.ts universeOf, frozen in universe.json): the event's markets that
# are active, not closed, accepting orders and have traded (volume > 0), in gamma's market order, each its conditionId,
# its name (groupItemTitle), its slug and its Yes token (clobTokenIds[0]); 24 markets, snapshot
# 2026-11-13T06:20:49.060Z (`node collector/polymarket-forecast/cli.ts universe --out
# competitions/polymarket-nvidia-ceo-forecast-01/universe.json`). A market Polymarket adds later is not in it. The
# event's other 83 markets are inactive placeholders ("Candidate S" and the like, and "Other").
#
# The prices (grid.ts): each universe market's Yes price from Polymarket's public price history (CLOB /prices-history,
# fidelity 1 minute, about one point a minute, the order book's midpoint), on a 1-minute UTC grid: minute m's price is
# the last point with t <= m, forward-filled; a market's grid starts at the first whole minute at or after its first
# point; values as Polymarket gives them.
#
# The cases (freeze.ts): a checkpoint every 4 hours from W0, the deadline: the final's h00..h11 at W0 + 4k h, k = 0..11,
# each forecasting the 240 minutes c_k+1 .. c_k+240, so every minute of the 48-hour window is forecast once. A case holds
# the universe markets that had a price point at or before its checkpoint (all 24 in the final), each with its last 72
# hours (4,320 minutes) of grid ending at the checkpoint, or from its grid's start when that is later: nothing after it.
# The answer (reference/answer.json, makefun/polymarket-answer/v1) holds each case's markets and their actual grid prices
# at each scored minute. The window's real end E = min(W0 + 48 h, R), R the first minute the house recorder sees the
# event stop trading (market.ts stopSignalOf: a universe market's Yes proposed, reproposed or resolved as winning at
# price 1 on data-api /v2/resolutions, or a Yes token marked winner on the CLOB, or every universe market closed; a stop
# seen late takes the decision's own time on the resolutions row, floored to the minute, when it is after the last poll
# that read no stop, never before W0: record.ts stopMinuteOf); only minutes <= E are scored, a case with none is
# dropped, and with none at all there is no answer, no grade and no prize. answer.window is the nominal {deadline, until} (server/admin/dataset-register.ts
# polymarketFamily holds it to the deadline and the final phase's start), and answer.recorded {end, ended_by} is where
# the recording really stopped.
#
# Format: program/v1, `cases: per-file` beside `final_dataset: true` (contracts/competition.ts, #13): each case run
# alone in a sandbox of its own, /input holding only <id>.in, its /output/<id>.out kept only when that run ended ok
# (grader/program.ts executePerCase), each under its manifest time_cap_ms (8,000). The final grades on a dataset the
# house recorder (deploy/k8s/components/polymarket-nvidia-ceo-forecast, `collector/polymarket-forecast/cli.ts record
# --w0 <deadline> --hours 48 --freeze-out /opt/make.fun/data/datasets/polymarket-nvidia-ceo-forecast-01-final`) records
# from W0 and freezes at E once every market was fetched from E + 5 minutes on (or at E + 2 hours with what it holds);
# the automation's lock step registers that freeze sealed and attaches it to the final phase
# (server/competitions/lifecycle/auto.ts frozenFinalStage, the window held by the Polymarket family). The dev phase
# grades on this directory's own sealed practice instance (input/, reference/), cut by `node
# collector/polymarket-forecast/cli.ts practice --from 2026-11-12T06:00:00Z --universe
# competitions/polymarket-nvidia-ceo-forecast-01/universe.json --out competitions/polymarket-nvidia-ceo-forecast-01`
# from Polymarket's history: p00..p05 every 4 hours from 2026-11-12T06:00:00Z, answered through 2026-11-13T06:00:00Z,
# p00 to p02 holding 19 markets, p03 23 and p04 and p05 all 24 (the markets started at different times: six on
# 2026-11-10, the rest from 2026-11-11T22:57Z to 2026-11-12T18:11Z).
#
# Scoring (scorer/score.ts, node22 stdlib): every (case, market, scored minute, level tau) is one item, its pinball loss
# 100 * max(tau * (y - q), (tau - 1) * (y - q)) in percentage points; loss is the mean over every item (6 decimals,
# lower better, the rank); an invalid case is scored as if every quantile were 0.5, and makes valid 0, the gate, so the
# entry ranks below every valid one and takes no prize. median_error and coverage_90 are information; run_ms (the
# grader's run.json wall_ms, the run time per execution over every case) breaks an exact tie, faster first, then the
# earlier receipt (.cosmos/rules/contest-design.mdc). The house baseline (baseline/main.ts, the kit's starter/ byte for
# byte) is persistence: q = clamp(x + z * 0.0025 * sqrt(h), 0, 1) to 6 decimals from each market's last price x, its
# numbers fixed in advance; on the practice it scores loss 0.363589 (median_error 0.767503, coverage_90 0.949642).
#
# The prize gate (prize_requires_beating_baseline): a prize needs a loss strictly below the best of the phase's ranked
# baseline entries: the persistence baseline (house.yaml, entered by the automation 4 hours before the deadline, T0+8h)
# and the house model one-shot (grader/house-forecast.ts's per-file Polymarket kind, entered by
# scripts/competitions/house-forecast.ts `--slug polymarket-nvidia-ceo-forecast-01 --phase dev|final --model superbot
# --reasoning-effort max`): superbot at reasoning effort max (.cosmos/rules/house-models.mdc, 64,000 output tokens), one
# recorded call per phase (asked once more, the same prompt, only if its first answer is not a valid forecast:
# HOUSE_FORECAST_ATTEMPTS 2) on the history to its cut (practice: p00's, to 2026-11-12T06:00:00Z; final: deadline - 1 h),
# answering each market's sigma and drift, replayed per case by grader/house-forecast-entry-cases with no model call:
# q = clamp(x + drift * h / 60 + z * sigma * sqrt(h), 0, 1). Both are flagged baseline; the rules name the model.
#
# Prizes: $250 over 100 places, $40 / $25 / $15 / $5 x7 / $1.50 x90 (tests/unit/catalogue.test.ts HUNDRED_250_TABLE,
# the owner's "$250 ... spread across like at least 100 entrants"), each place written out as the catalogue's tables
# list it. Full automation (lifecycle true, payouts auto), its escrow funded at open (automation.escrow: at_open;
# server/competitions/load.ts escrowAtOpenIssues: placement prizes, lifecycle true, a final phase with an end, starting
# 48 hours after the deadline, far past the commit window): the rules' Entries and Payout and the criteria's and
