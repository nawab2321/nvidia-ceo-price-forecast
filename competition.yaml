# The loss ranks (6 decimals, public rows to 3 significant figures: the catalogue rounds every paid rank column,
# tests/unit/catalogue.test.ts; the rules say so); median_error and coverage_90 are information; valid is the gate
# (harness.gate): an entry with an invalid case ranks below every valid one; run_ms, the grader's run time per
# execution over every case (/scores/run.json wall_ms, which the scorer copies), breaks an exact tie (tie_break_index).
leaderboard:
  title: Results
  primary_index: 0
  tie_break_index: 4
  columns:
    - {key: loss, title: "Pinball loss (points)", index: 0, sorting: asc, precision: 6, significant_figures: 3}
    - {key: median_error, title: "Median error (points)", index: 1, sorting: asc, precision: 4}
    - {key: coverage_90, title: "90% coverage (nominal 0.9)", index: 2, sorting: desc, precision: 4}
    - {key: valid, title: Every case valid, index: 3, sorting: desc, precision: 0}
    - {key: run_ms, title: "Program run time (ms)", index: 4, sorting: asc, precision: 0}

submission_rule:
  rule: Force_Last
  max_per_day: 10
  max_total: 10
  transcripts_required: true
  strategy_note_required: false
  license: osi
  repo_created_after_open: true
  house_only: false

